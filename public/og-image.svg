<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#161922" />
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#5856d6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#5856d6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g transform="translate(100, 100)">
    <!-- Brand monogram -->
    <rect width="72" height="72" rx="18" fill="#5856d6" />
    <text x="36" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">RL</text>

    <!-- Name -->
    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="74" font-weight="700" fill="#ffffff" letter-spacing="-0.03em">Ryan Lilker</text>

    <!-- Title -->
    <text x="0" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="500" fill="#a5b4fc" letter-spacing="-0.01em">Experienced Software Engineer</text>

    <!-- Details -->
    <text x="0" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">30 Years Experience · Manchester, UK · ryanlilker.com</text>
  </g>
</svg>
