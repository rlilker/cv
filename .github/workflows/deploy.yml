# ─────────────────────────────────────────────────────────────────────────────
#  Deploy: build the Astro site and publish it to S3 + CloudFront.
#
#  Triggers on every push to `main`, and can be run by hand from the Actions
#  tab. Authentication uses GitHub's OIDC provider, so there are no long-lived
#  AWS access keys stored as repository secrets — the workflow exchanges a
#  short-lived GitHub token for the deploy role created by
#  infra/cloudformation.yml.
#
#  Required repository secrets (Settings -> Secrets and variables -> Actions):
#    AWS_DEPLOY_ROLE_ARN  - the DeployRoleArn stack output
#    DISTRIBUTION_ID      - the DistributionId stack output
#
#  The AWS_REGION is intentionally the stack's own region; the S3 bucket name
#  is resolved from the bucket itself so the workflow needs no extra secret.
#
#  Optional repository variables (Settings -> Secrets and variables -> Actions ->
#  Variables). Without them the Family Assistant dashboard builds and deploys but
#  shows a "not configured yet" notice, and sign-in and push are unavailable:
#    PUBLIC_FIREBASE_API_KEY, PUBLIC_FIREBASE_AUTH_DOMAIN,
#    PUBLIC_FIREBASE_PROJECT_ID, PUBLIC_FIREBASE_APP_ID,
#    PUBLIC_FIREBASE_MESSAGING_SENDER_ID, PUBLIC_FIREBASE_VAPID_KEY
#
#  These are public values by design (see the Build step) and are documented in
#  docs/DEPLOY_FIRESTORE.md §4 in the service repository.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]
  # Allows a manual re-run from the Actions tab, e.g. after a CloudFront fix.
  workflow_dispatch:

# Cancel superseded runs so rapid pushes don't deploy out of order.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  # Required so the workflow can request an OIDC token at all.
  id-token: write
  contents: write

jobs:
  build-and-deploy:
    name: Build and deploy to S3
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare release version
        id: release
        run: |
          set -euo pipefail
          CURRENT=$(node scripts/bump-version.mjs --current)
          if git show-ref --verify --quiet "refs/tags/v$CURRENT"; then
            VERSION=$(node scripts/bump-version.mjs)
          else
            # The baseline version is the first release, not a release to skip.
            VERSION="$CURRENT"
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release tag v$VERSION already exists."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        env:
          # Firebase web config, injected at build time so it can be read via
          # import.meta.env. These are repository *variables* rather than secrets
          # on purpose: the Firebase web config and the VAPID key are public by
          # design and end up in browser JavaScript, where anyone can read them.
          # Access is controlled entirely by Firestore security rules, so there is
          # nothing here worth hiding - and calling it a secret would suggest
          # otherwise and discourage the next person from looking.
          #
          # Unset variables expand to an empty string, so the build still succeeds
          # and the dashboard renders its "not configured" notice. That is
          # deliberate: a missing Firebase config must not block deploys of the
          # rest of the site.
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_VAPID_KEY: ${{ vars.PUBLIC_FIREBASE_VAPID_KEY }}

      # Astro can report a successful build that is missing content; this
      # fails the deploy before anything is published.
      - name: Verify build output
        run: npm run verify

      # Fail with an actionable message rather than letting the AWS steps
      # complain about a missing input several steps later.
      - name: Check configuration
        env:
          DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          DISTRIBUTION_ID: ${{ secrets.DISTRIBUTION_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
        run: |
          missing=()
          [ -n "$DEPLOY_ROLE_ARN" ] || missing+=("secret AWS_DEPLOY_ROLE_ARN")
          [ -n "$DISTRIBUTION_ID" ]     || missing+=("secret DISTRIBUTION_ID")
          [ -n "$AWS_REGION" ]          || missing+=("variable AWS_REGION")
          [ -n "$SITE_BUCKET" ]         || missing+=("variable SITE_BUCKET")

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### ⚠️ Deploy skipped — AWS not configured yet"
              echo ""
              echo "Missing on this repository:"
              for m in "${missing[@]}"; do echo "- \`$m\`"; done
              echo ""
              echo "Deploy the CloudFormation stack first, then fill these in from its outputs:"
              echo ""
              echo '```bash'
              echo 'aws cloudformation deploy \'
              echo '  --template-file infra/cloudformation.yml \'
              echo '  --stack-name cv-site \'
              echo '  --capabilities CAPABILITY_NAMED_IAM \'
              echo '  --parameter-overrides DomainName=ryanlilker.com GitHubOrg=rlilker'
              echo '```'
              echo ""
              echo "See the repository README → *One-time AWS setup*."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::Missing GitHub configuration: ${missing[*]}. See the job summary."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve bucket name
        id: bucket
        env:
          # Repository variable, set once to the BucketName stack output.
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_BUCKET:-}" ]; then
            echo "::error::Repository variable SITE_BUCKET is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          if ! aws s3api head-bucket --bucket "$SITE_BUCKET" 2>/dev/null; then
            echo "::error::Bucket '$SITE_BUCKET' not found or not accessible with the deploy role."
            exit 1
          fi
          echo "name=$SITE_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        run: |
          set -euo pipefail
          BUCKET="${{ steps.bucket.outputs.name }}"

          # Long-lived cache for content-hashed assets. Astro fingerprints
          # everything under /_astro/, so these URLs change when the bytes
          # change and can be cached forever.
          aws s3 sync dist/ "s3://$BUCKET/" \
            --delete \
            --exclude "*" \
            --include "_astro/*" \
            --cache-control "public,max-age=31536000,immutable"

          # Everything else (HTML, manifest, robots.txt) must revalidate, or
          # an updated CV would keep serving the old copy for a year.
          aws s3 sync dist/ "s3://$BUCKET/" \
            --delete \
            --exclude "_astro/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          set -euo pipefail
          # Only /* is needed: the cached /_astro/* URLs are content-hashed and
          # never change for the same bytes.
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Created invalidation $INVALIDATION_ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ secrets.DISTRIBUTION_ID }}" \
            --id "$INVALIDATION_ID"

      - name: Verify the live site
        env:
          SITE: https://ryanlilker.com
        run: |
          set -uo pipefail
          # Replaces the old scripts/verify-live.sh, which needed a local shell
          # and so could only be run by hand. Doing it here means every publish
          # is checked automatically, with no AWS CLI on the developer machine.
          fail=0
          step() { printf '\n::group::%s\n' "$1"; printf '::endgroup::\n'; }

          # Each route is checked for the marker that page must contain, not
          # just for a 200. A status-only check passes even when the wrong
          # document is served: CloudFront's 403 rule rewrites unknown paths to
          # /index.html, so /family-assistant returned 200 with the CV on it and
          # the status check was perfectly happy.
          check_page() {
            local path="$1" marker="$2" label="$3"
            local body code
            body=$(curl -sSL --max-time 20 "$SITE$path" 2>/dev/null || true)
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 "$SITE$path" 2>/dev/null || echo 000)
            if [ "$code" != "200" ]; then
              echo "  FAIL  $label ($path) -> $code"
              fail=1
            elif printf '%s' "$body" | grep -qF "$marker"; then
              echo "  PASS  $label ($path) -> 200, right content"
            else
              echo "  FAIL  $label ($path) -> 200 but wrong page (no \"$marker\")"
              fail=1
            fi
          }

          step "Each route serves its own page"
          # Markers are unique to the page, so a wrong-but-200 response fails.
          check_page "/" "Experienced Software Engineer" "CV"
          check_page "/family-assistant" "Family Gmail to shared calendar" "Family Assistant"
          check_page "/family-assistant/privacy" "Privacy Policy" "Privacy policy"
          check_page "/family-assistant/terms" "Terms &amp; Conditions" "Terms"

          step "Content is really published"
          body=$(curl -sSL --max-time 20 "$SITE/" || true)
          for pair in "Ryan Lilker:name" \
                      "Experienced Software:role" \
                      "PortSwigger:employer" \
                      "CMap Software:employer" \
                      "iSOFT plc:employer" \
                      "Family Assistant:projects link" \
                      "application/ld+json:JSON-LD"; do
            needle=${pair%%:*}
            label=${pair##*:}
            if printf '%s' "$body" | grep -qF "$needle"; then
              echo "  PASS  contains: $label"
            else
              echo "  FAIL  missing: $label"
              fail=1
            fi
          done

          step "Security headers"
          headers=$(curl -sSI --max-time 20 "$SITE/" || true)
          check_header() {
            if printf '%s' "$headers" | grep -qi "$1"; then
              echo "  PASS  $2"
            else
              echo "  FAIL  $2 not present"
              fail=1
            fi
          }
          check_header "strict-transport-security" "HSTS"
          check_header "x-content-type-options"    "X-Content-Type-Options"
          check_header "x-frame-options"            "X-Frame-Options"
          check_header "referrer-policy"            "Referrer-Policy"

          step "HTTP is redirected to HTTPS"
          # Uses the apex over plain HTTP; CloudFront's redirect-to-https should
          # answer with a 301 to the https:// equivalent.
          redir=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 20 "http://ryanlilker.com/" 2>/dev/null || true)
          case "$redir" in
            https://*) echo "  PASS  HTTP -> HTTPS" ;;
            *) echo "  NOTE  no redirect observed (may be unreachable right now)" ;;
          esac

          if [ "$fail" -ne 0 ]; then
            {
              echo "### ⚠️ Live checks failed"
              echo ""
              echo "- Certificate still pending → ACM console, wait for ISSUED."
              echo "- 404 on a sub-page → the sync above may not have covered it."
              echo "- Stale content → CloudFront cached it; re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Live site checks failed after deploy."
            exit 1
          fi
          echo "Live checks passed."

      # Only a verified publish advances the version. The metadata commit is
      # skipped by Actions so it cannot start a second deployment.
      - name: Record verified publish
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record verified publish $TAG [skip ci]"
          fi
          git tag "$TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          {
            echo "### 🚀 Deployed to S3 + CloudFront"
            echo ""
            echo "- **Commit:** \`${GITHUB_SHA::7}\`"
            echo "- **Branch:** \`${GITHUB_REF_NAME}\`"
            echo "- **By:** ${GITHUB_ACTOR}"
            echo "- **Site:** https://ryanlilker.com/"
            echo "- **Release:** \`v${{ steps.release.outputs.version }}\`"
            echo ""
            echo "CloudFront is serving the new build once the invalidation completes."
          } >> "$GITHUB_STEP_SUMMARY"
