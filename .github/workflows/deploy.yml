# ─────────────────────────────────────────────────────────────────────────────
#  Deploy: build the Astro site and publish it to S3 + CloudFront.
#
#  Triggers on every push to `main`, and can be run by hand from the Actions
#  tab. Authentication uses GitHub's OIDC provider, so there are no long-lived
#  AWS access keys stored as repository secrets — the workflow exchanges a
#  short-lived GitHub token for the deploy role created by
#  infra/cloudformation.yml.
#
#  Required repository secrets (Settings -> Secrets and variables -> Actions):
#    AWS_DEPLOY_ROLE_ARN  - the DeployRoleArn stack output
#    DISTRIBUTION_ID      - the DistributionId stack output
#
#  The AWS_REGION is intentionally the stack's own region; the S3 bucket name
#  is resolved from the bucket itself so the workflow needs no extra secret.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]
  # Allows a manual re-run from the Actions tab, e.g. after a CloudFront fix.
  workflow_dispatch:

# Cancel superseded runs so rapid pushes don't deploy out of order.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  # Required so the workflow can request an OIDC token at all.
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy to S3
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Astro can report a successful build that is missing content; this
      # fails the deploy before anything is published.
      - name: Verify build output
        run: npm run verify

      # Fail with an actionable message rather than letting the AWS steps
      # complain about a missing input several steps later.
      - name: Check configuration
        env:
          DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          DISTRIBUTION_ID: ${{ secrets.DISTRIBUTION_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
        run: |
          missing=()
          [ -n "$DEPLOY_ROLE_ARN" ] || missing+=("secret AWS_DEPLOY_ROLE_ARN")
          [ -n "$DISTRIBUTION_ID" ]     || missing+=("secret DISTRIBUTION_ID")
          [ -n "$AWS_REGION" ]          || missing+=("variable AWS_REGION")
          [ -n "$SITE_BUCKET" ]         || missing+=("variable SITE_BUCKET")

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### ⚠️ Deploy skipped — AWS not configured yet"
              echo ""
              echo "Missing on this repository:"
              for m in "${missing[@]}"; do echo "- \`$m\`"; done
              echo ""
              echo "Deploy the CloudFormation stack first, then fill these in from its outputs:"
              echo ""
              echo '```bash'
              echo 'aws cloudformation deploy \'
              echo '  --template-file infra/cloudformation.yml \'
              echo '  --stack-name cv-site \'
              echo '  --capabilities CAPABILITY_NAMED_IAM \'
              echo '  --parameter-overrides DomainName=ryanlilker.com GitHubOrg=rlilker'
              echo '```'
              echo ""
              echo "See the repository README → *One-time AWS setup*."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::Missing GitHub configuration: ${missing[*]}. See the job summary."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve bucket name
        id: bucket
        env:
          # Repository variable, set once to the BucketName stack output.
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_BUCKET:-}" ]; then
            echo "::error::Repository variable SITE_BUCKET is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          if ! aws s3api head-bucket --bucket "$SITE_BUCKET" 2>/dev/null; then
            echo "::error::Bucket '$SITE_BUCKET' not found or not accessible with the deploy role."
            exit 1
          fi
          echo "name=$SITE_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        run: |
          set -euo pipefail
          BUCKET="${{ steps.bucket.outputs.name }}"

          # Long-lived cache for content-hashed assets. Astro fingerprints
          # everything under /_astro/, so these URLs change when the bytes
          # change and can be cached forever.
          aws s3 sync dist/ "s3://$BUCKET/" \
            --delete \
            --exclude "*" \
            --include "_astro/*" \
            --cache-control "public,max-age=31536000,immutable"

          # Everything else (HTML, manifest, robots.txt) must revalidate, or
          # an updated CV would keep serving the old copy for a year.
          aws s3 sync dist/ "s3://$BUCKET/" \
            --delete \
            --exclude "_astro/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          set -euo pipefail
          # Only /* is needed: the cached /_astro/* URLs are content-hashed and
          # never change for the same bytes.
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Created invalidation $INVALIDATION_ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ secrets.DISTRIBUTION_ID }}" \
            --id "$INVALIDATION_ID"

      - name: Verify the live site
        env:
          SITE: https://ryanlilker.com
        run: |
          set -uo pipefail
          # Replaces the old scripts/verify-live.sh, which needed a local shell
          # and so could only be run by hand. Doing it here means every publish
          # is checked automatically, with no AWS CLI on the developer machine.
          fail=0
          step() { printf '\n::group::%s\n' "$1"; printf '::endgroup::\n'; }

          step "Pages return 200"
          for p in / /family-planner/ /family-planner/privacy/ /family-planner/terms/; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 "$SITE$p" || echo 000)
            if [ "$code" = "200" ]; then
              echo "  PASS  $p -> 200"
            else
              echo "  FAIL  $p -> $code"
              fail=1
            fi
          done

          step "Content is really published"
          body=$(curl -sSL --max-time 20 "$SITE/" || true)
          for pair in "Ryan Lilker:name" \
                      "Principal Software:role" \
                      "CMap Software:employer" \
                      "iSOFT plc:employer" \
                      "Family Planner:projects link" \
                      "application/ld+json:JSON-LD"; do
            needle=${pair%%:*}
            label=${pair##*:}
            if printf '%s' "$body" | grep -qF "$needle"; then
              echo "  PASS  contains: $label"
            else
              echo "  FAIL  missing: $label"
              fail=1
            fi
          done

          step "Security headers"
          headers=$(curl -sSI --max-time 20 "$SITE/" || true)
          check_header() {
            if printf '%s' "$headers" | grep -qi "$1"; then
              echo "  PASS  $2"
            else
              echo "  FAIL  $2 not present"
              fail=1
            fi
          }
          check_header "strict-transport-security" "HSTS"
          check_header "x-content-type-options"    "X-Content-Type-Options"
          check_header "x-frame-options"            "X-Frame-Options"
          check_header "referrer-policy"            "Referrer-Policy"

          step "HTTP is redirected to HTTPS"
          # Uses the apex over plain HTTP; CloudFront's redirect-to-https should
          # answer with a 301 to the https:// equivalent.
          redir=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 20 "http://ryanlilker.com/" 2>/dev/null || true)
          case "$redir" in
            https://*) echo "  PASS  HTTP -> HTTPS" ;;
            *) echo "  NOTE  no redirect observed (may be unreachable right now)" ;;
          esac

          if [ "$fail" -ne 0 ]; then
            {
              echo "### ⚠️ Live checks failed"
              echo ""
              echo "- Certificate still pending → ACM console, wait for ISSUED."
              echo "- 404 on a sub-page → the sync above may not have covered it."
              echo "- Stale content → CloudFront cached it; re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Live site checks failed after deploy."
            exit 1
          fi
          echo "Live checks passed."

      - name: Deployment summary
        run: |
          {
            echo "### 🚀 Deployed to S3 + CloudFront"
            echo ""
            echo "- **Commit:** \`${GITHUB_SHA::7}\`"
            echo "- **Branch:** \`${GITHUB_REF_NAME}\`"
            echo "- **By:** ${GITHUB_ACTOR}"
            echo "- **Site:** https://ryanlilker.com/"
            echo ""
            echo "CloudFront is serving the new build once the invalidation completes."
          } >> "$GITHUB_STEP_SUMMARY"
