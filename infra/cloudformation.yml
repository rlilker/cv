# =============================================================================
#  ryanlilker.com — static site infrastructure
#
#      Route 53 (alias)  ->  CloudFront  ->  S3 (private origin)
#
#  Deploy everything into us-east-1. That is deliberate:
#    - an ACM certificate used by CloudFront MUST be in us-east-1;
#    - CloudFront, IAM and Route 53 are global, so their region is irrelevant;
#    - S3 in us-east-1 is not more expensive here, because data transferred
#      from S3 to CloudFront is free.
#  One region for the whole stack keeps this to a single command.
#
#  Cost: Route 53 hosted zone ~$0.50/mo. Everything else is inside the free
#  tier at CV-site traffic levels.
#
#  Deploy the stack with one aws command, then never again from this machine.
#  Everything after this is handled by .github/workflows/deploy.yml.
# =============================================================================

AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Static site for ryanlilker.com - private S3 origin behind CloudFront, with a
  GitHub Actions OIDC deploy role. Deploy to us-east-1.

Parameters:
  DomainName:
    Type: String
    Default: ryanlilker.com
    Description: Apex domain to serve.

  BucketName:
    Type: String
    Default: ''
    Description: >-
      Optional explicit S3 bucket name. Leave empty to derive one from the
      domain name.

  GitHubOrg:
    Type: String
    Default: rlilker
    Description: GitHub user or organisation that owns the repo.

  GitHubRepo:
    Type: String
    Default: cv
    Description: Repository name, used to scope the OIDC trust policy.

  SubjectBranch:
    Type: String
    Default: main
    Description: Branch allowed to deploy. Keep this to 'main'.

  DeployEnvironment:
    Type: String
    Default: production
    Description: >-
      GitHub environment used by the deploy workflow. A workflow that declares
      `environment:` always receives an environment OIDC subject instead of a
      branch one, so this must match the workflow exactly.

  CreateHostedZone:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Set true ONLY if no hosted zone for the domain exists in this account.
      You will then need to point the domain's nameservers at Route 53 before
      the certificate can validate.

  ExistingHostedZoneId:
    Type: String
    Default: ''
    Description: >-
      If the hosted zone already exists in this account, paste its ID here
      (e.g. Z1234567890ABC). The stack then creates the DNS records and the
      certificate validates automatically. Leave empty otherwise.

Mappings:
  # CloudFront resource names accept only [A-Za-z0-9_-], so a domain containing
  # dots cannot be interpolated into them directly. CloudFormation has no
  # string-replace function, so the safe form of each domain is declared here
  # and referenced with FindInMap. Adding a domain means adding a block.
  #
  # A Mappings section is always three levels deep - map name, then a key, then
  # a second key. A two-level version is rejected outright with "Every Mappings
  # member <key> must be a map", which is why the value sits under `Name`
  # instead of being written directly against the domain.
  SanitizedDomain:
    ryanlilker.com:
      Name: ryanlilker-com

Conditions:
  UseExplicitBucketName: !Not [!Equals [!Ref BucketName, '']]
  CreateZone: !Equals [!Ref CreateHostedZone, 'true']
  HaveExistingZone: !Not [!Equals [!Ref ExistingHostedZoneId, '']]
  # True only when we know a zone id, so we can write records and validate.
  CanManageDns: !Or [!Condition CreateZone, !Condition HaveExistingZone]

Resources:
  # ── Content bucket ─────────────────────────────────────────────────────────
  #
  #  Kept fully private. CloudFront reads it through an Origin Access Control,
  #  so there is no public bucket policy anywhere and the only route to the
  #  content is through the distribution.

  SiteBucket:
    Type: AWS::S3::Bucket
    # The bucket is NOT retained on delete, and that is deliberate. Its contents
    # are build output, reproducible from git with one push, so retaining it
    # protects nothing. Worse, a retained bucket outlives a failed create, and
    # the next deploy then fails its early ResourceExistenceCheck because the
    # bucket it wants to create already exists - with no useful error message.
    # A failed deploy must leave nothing behind, so a retry can just work.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - UseExplicitBucketName
        - !Ref BucketName
        - !Sub '${DomainName}-cv-site'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # Keeps rollback available without storing every old build forever.
          - Id: RetireOldDeployments
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # ── Bucket policy ───────────────────────────────────────────────────────────
  #
  #  Required for an Origin Access Control. OAC tells S3 to accept signed
  #  requests from CloudFront, but on its own it grants nothing: without a
  #  bucket policy S3 answers every origin fetch with AccessDenied and the site
  #  returns 403 through CloudFront. The policy is the other half of OAC and is
  #  scoped to this one distribution's service principal, so no other
  #  distribution - and nothing on the public internet - can read the bucket.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                # Ties the grant to this distribution. Without this, any
                # CloudFront distribution in any account could read the bucket.
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ── TLS ────────────────────────────────────────────────────────────────────

  # us-east-1 only, because CloudFront rejects a certificate from any other
  # region. DomainValidationOptions is supplied only when we know the hosted
  # zone id, so ACM can write its own validation records.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub 'www.${DomainName}'
      ValidationMethod: DNS
      # ACM accepts EITHER HostedZoneId OR ValidationDomain for each name, never
      # both - supplying both is rejected outright. HostedZoneId is the
      # stronger option because it lets ACM write the validation records itself.
      DomainValidationOptions: !If
        - CanManageDns
        - - DomainName: !Ref DomainName
            HostedZoneId: !If [CreateZone, !Ref HostedZone, !Ref ExistingHostedZoneId]
          - DomainName: !Sub 'www.${DomainName}'
            HostedZoneId: !If [CreateZone, !Ref HostedZone, !Ref ExistingHostedZoneId]
        - !Ref AWS::NoValue

  # ── CloudFront ─────────────────────────────────────────────────────────────

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        # CloudFront names accept only [A-Za-z0-9_-]. A domain contains dots, so
        # 'ryanlilker.com-cv-oac' is rejected with a 400. The safe form comes
        # from the SanitizedDomain mapping rather than a hard-coded string, so it
        # cannot drift from the DomainName parameter.
        Name: !Sub
          - '${Safe}-cv-oac'
          - Safe: !FindInMap [SanitizedDomain, !Ref DomainName, Name]
        Description: OAC for the static site S3 origin
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        # Same [A-Za-z0-9_-] restriction as the origin access control name above.
        Name: !Sub
          - '${Safe}-cv-headers'
          - Safe: !FindInMap [SanitizedDomain, !Ref DomainName, Name]
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: SAMEORIGIN
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub 'Static site for ${DomainName}'
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        # Without these aliases the distribution only answers on its default
        # *.cloudfront.net name, so ryanlilker.com reaches CloudFront over DNS
        # but gets "sslv3 alert handshake failure" - the edge has no custom
        # domain to match, and the certificate is never presented. The Route 53
        # records alone are not enough; the domain must be attached here too.
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        # PriceClass_All is deliberate: the 1 TB free tier is global, and
        # narrowing it to a cheaper region would only hurt UK visitors.
        PriceClass: PriceClass_All
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              # Required by CloudFormation even when OAC is in use.
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          # 4135ea2d-6df8-44a3-9df3-4b5a84be39ad is the managed
          # CachingOptimized policy. It ignores cookies and query strings, so
          # every response is cacheable at the edge.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
        # Serve index.html for unknown paths so the site keeps resolving even
        # if it grows beyond a single page.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
        ViewerCertificate:
          # Ref, not !GetAtt Certificate.Arn. The only GetAtt attributes this
          # resource publishes are CertificateArn and CertificateStatus - there
          # is no 'Arn' attribute, and asking for one fails the stack with
          # "Requested attribute Arn does not exist in schema for
          # AWS::CertificateManager::Certificate". Ref returns the ARN.
          AcmCertificateArn: !Ref Certificate
          # SNI keeps this free; a dedicated IP would cost ~$20/month.
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  # ── DNS ────────────────────────────────────────────────────────────────────
  #
  #  Only created when we have a usable zone. If neither condition holds, the
  #  A records must be made by hand; the outputs give you the values.

  HostedZone:
    Type: AWS::Route53::HostedZone
    Condition: CreateZone
    Properties:
      Name: !Sub '${DomainName}.'
      HostedZoneConfig:
        Comment: Hosted zone for the static site

  ApexAlias:
    Type: AWS::Route53::RecordSet
    Condition: CanManageDns
    Properties:
      HostedZoneId: !If [CreateZone, !Ref HostedZone, !Ref ExistingHostedZoneId]
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        # CloudFront's own hosted zone id, not the Route 53 zone above. It is the
        # same fixed value for every distribution and is not a GetAtt attribute
        # of AWS::CloudFront::Distribution - asking for one fails with
        # "Requested attribute HostedZoneId does not exist in schema for
        # AWS::CloudFront::Distribution".
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwAlias:
    Type: AWS::Route53::RecordSet
    Condition: CanManageDns
    Properties:
      HostedZoneId: !If [CreateZone, !Ref HostedZone, !Ref ExistingHostedZoneId]
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        # CloudFront's fixed hosted zone id; see the note on the record above.
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false


  # ── GitHub Actions OIDC ────────────────────────────────────────────────────
  #
  #  This is what removes the need to store AWS keys in GitHub at all.

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # IAM still requires at least one thumbprint. This is the well-known leaf
      # for token.actions.githubusercontent.com, published by GitHub. IAM no
      # longer uses it for trust decisions, but the field cannot be empty.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # Scoped to this repo AND this branch. A job on any other branch, or a pull
  # request from a fork, cannot assume this role.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${DomainName}-cv-github-deploy'
      Description: Assumed by GitHub Actions to publish the static site
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                # A GitHub OIDC subject takes exactly one form per run, chosen by
                # the most specific ref available. This workflow declares
                # `environment: production`, so GitHub sends
                #   repo:ORG/REPO:environment:production
                # for EVERY run, including plain pushes to the default branch -
                # the environment claim replaces the branch one. Pinning only
                # the branch form (repo:...:ref:refs/heads/main) therefore fails
                # every run with "Not authorized to perform
                # sts:AssumeRoleWithWebIdentity", because no run ever presents
                # that subject.
                #
                # Both real forms are listed. Dropping the environment claim
                # would mean removing `environment:` from the workflow, which
                # loses the manual-approval gate on a deploy role; keeping the
                # branch claim as well means the role still stops working the
                # day the environment is renamed.
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${SubjectBranch}'
                  - !Sub 'repo:${GitHubOrg}/${GitHubRepo}:environment:${DeployEnvironment}'
      Policies:
        - PolicyName: PublishSite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt SiteBucket.Arn
              - Sid: ReadWriteObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Sid: InvalidateCache
                Effect: Allow
                # GetInvalidation is required as well as CreateInvalidation: the
                # workflow calls `aws cloudfront wait invalidation-completed`,
                # which polls GetInvalidation. Without it the publish succeeds
                # but the job fails on the wait.
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  BucketName:
    Description: S3 bucket holding the built site
    Value: !Ref SiteBucket

  DistributionId:
    Description: Set as the DISTRIBUTION_ID GitHub secret
    Value: !Ref Distribution

  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN GitHub secret
    Value: !GetAtt DeployRole.Arn

  CertificateArn:
    Description: ACM certificate, created in us-east-1
    # Ref returns the certificate ARN; see the note on ViewerCertificate.
    Value: !Ref Certificate

  CloudFrontDomain:
    Description: The cloudfront.net hostname - works before DNS is configured
    Value: !GetAtt Distribution.DomainName

  CloudFrontHostedZoneId:
    Description: Use this when creating Route 53 alias records by hand
    # CloudFront's hosted zone id is the same fixed value for every
    # distribution; it is not a GetAtt attribute of the distribution.
    Value: Z2FDTNDATAQYW2

  Route53ZoneId:
    Condition: CanManageDns
    Description: The hosted zone the stack wrote the records into
    Value: !If [CreateZone, !Ref HostedZone, !Ref ExistingHostedZoneId]

  SiteUrl:
    Description: Where the site will be live once DNS is in place
    Value: !Sub 'https://${DomainName}/'

  NextSteps:
    Description: What is left to do by hand
    Value: !If
      - CanManageDns
      - 'DNS records were created. Wait for the certificate to reach ISSUED, then push to main.'
      - 'No hosted zone was available: create A alias records for the apex and www pointing at the CloudFrontDomain output, then push to main.'

